version: '3.8'

services:

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    volumes:
      - ./ecom-realm.json:/opt/keycloak/data/import/ecom-realm.json
    ports:
      - "8080:8080"
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: ./gateway
    ports:
      - "8085:8085"
    networks:
      - ecom-network
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
    depends_on:
      keycloak:
        condition: service_healthy

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order123
    ports:
      - "5432:5432"
    networks:
      - ecom-network
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:15-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product123
    ports:
      - "5433:5432"
    networks:
      - ecom-network
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d productdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    networks:
      - ecom-network
    environment:
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=order
      - SPRING_DATASOURCE_PASSWORD=order123
    depends_on:
      keycloak:
        condition: service_healthy
      order-db:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
    ports:
      - "8081:8081"
    networks:
      - ecom-network
    environment:
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
      - SPRING_DATASOURCE_URL=jdbc:postgresql://product-db:5432/productdb
      - SPRING_DATASOURCE_USERNAME=product
      - SPRING_DATASOURCE_PASSWORD=product123
    depends_on:
      keycloak:
        condition: service_healthy
      product-db:
        condition: service_healthy

  react-app:
    build:
      context: ./react-app
    ports:
      - "3000:80"
    networks:
      - ecom-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_URL=http://localhost:8080
      - API_BASE_URL=http://localhost:8085

networks:
  ecom-network:
    driver: bridge

volumes:
  order-db-data:
  product-db-data:

