version: '3.8'

services:

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    volumes:
      - ./ecom-realm.json:/opt/keycloak/data/import/ecom-realm.json
    ports:
      - "8080:8080"
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: ./gateway
    ports:
      - "8085:8085"
    networks:
      - ecom-network
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
    depends_on:
      keycloak:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    networks:
      - ecom-network
    environment:
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
    depends_on:
      keycloak:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
    ports:
      - "8081:8081"
    networks:
      - ecom-network
    environment:
      - OAUTH2_RESOURCE_SERVER_JWT_URI=http://keycloak:8080/realms/ecom
    depends_on:
      keycloak:
        condition: service_healthy

  react-app:
    build:
      context: ./react-app
    ports:
      - "3000:80"
    networks:
      - ecom-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_URL=http://localhost:8080
      - API_BASE_URL=http://localhost:8085

networks:
  ecom-network:
    driver: bridge
